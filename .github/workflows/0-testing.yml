name: Style and unit tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  run-tests:
    name: "Setup and run tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Style and formatting (ruff)
        run: |
          ruff check .

      - name: Unit and integration tests (pytest)
        run: |
          pytest

      # Comment out while it doesn't run:
      # [main]	ERROR	pyproject.toml : toml parser not available, reinstall with toml extra
      # Error: Invalid SARIF. JSON syntax error: Parsing SARIF file at 'results.sarif' failed: Unexpected end of JSON input
      #   # Bandit has to run before Mypy, because Mypy uses Docker, which creates files
      #   # that Bandit's sanity pre-cleanup can't remove.
      # - name: Bandit
      #   uses: PyCQA/bandit-action@v1
      #   with:
      #     configfile: pyproject.toml

      - name: Mypy Check
        uses: jpetrucciani/mypy-check@master
        with:
          python_version: ${{ matrix.python-version }}
          requirements: ".[dev]"
